<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thomson's LeetCode Tutor settings</title>
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="progress.css">
</head>
<body>
  <main>
    <header class="page-head">
      <img src="icons/icon-48.png" width="32" height="32" alt="">
      <div>
        <h1>Thomson's LeetCode Tutor</h1>
        <p class="sub" id="page-sub">Tutor settings</p>
      </div>
      <p id="connection" class="connection" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connection-text">Connecting</span></p>
    </header>

    <div class="tabs" role="tablist" aria-label="Sections">
      <button type="button" class="tab" role="tab" id="tab-progress" aria-controls="panel-progress" aria-selected="false" tabindex="-1">Progress</button>
      <button type="button" class="tab" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true">Settings</button>
      <button type="button" class="tab" role="tab" id="tab-changelog" aria-controls="panel-changelog" aria-selected="false" tabindex="-1">Changelog</button>
    </div>

    <div id="panel-settings" role="tabpanel" aria-labelledby="tab-settings">
      <div id="offline" class="notice warn" role="alert" hidden></div>

      <form id="form" novalidate>
        <section class="card" id="model-card" aria-labelledby="model-heading">
          <h2 id="model-heading">Model</h2>
          <div id="profiles" class="profiles" role="radiogroup" aria-label="Default model"></div>
          <div class="add-profile" id="add-profile"></div>
          <p id="profiles-note" class="hint" role="status" aria-live="polite"></p>
          <fieldset id="providers" class="providers">
            <legend class="sr-only">Selected model</legend>
          </fieldset>
          <div class="actions">
            <button type="button" id="test" class="btn">Test connection</button>
            <span id="test-result" class="result" role="status" aria-live="polite"></span>
          </div>
        </section>

        <section class="card" id="advanced-card" aria-labelledby="behavior-heading">
          <h2 id="behavior-heading">Advanced</h2>
          <div id="behavior"></div>
        </section>

        <div class="savebar">
          <p id="wait-note" class="result wait-note" hidden>Waiting for the helper app.</p>
          <p id="save-result" class="result" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="card" id="prompts-card" aria-labelledby="prompts-heading" hidden>
        <h2 id="prompts-heading">Prompts</h2>
        <div id="prompts-body"></div>
      </section>

      <section class="card" id="helper-card" aria-labelledby="helper-heading">
        <div class="helper-head">
          <h2 id="helper-heading">Helper</h2>
          <p id="helper-state" class="connection" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="helper-state-text">Checking</span></p>
        </div>
        <div id="helper-body"></div>
        <p id="helper-error" class="result" data-kind="error" role="alert" hidden></p>
      </section>

      <p id="foot" class="foot"></p>
      <p id="version-line" class="foot"></p>
    </div>

    <div id="panel-progress" role="tabpanel" aria-labelledby="tab-progress" hidden></div>

    <div id="panel-changelog" role="tabpanel" aria-labelledby="tab-changelog" hidden></div>
  </main>
  <script src="settings.js"></script>
  <script type="module" src="progress.js"></script>
</body>
</html>
